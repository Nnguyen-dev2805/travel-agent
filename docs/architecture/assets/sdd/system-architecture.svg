      <title id="sdd-architecture-title">Kiến trúc hệ thống hiện tại của Travel Agent</title>
      <desc id="sdd-architecture-desc">Browser client gọi backend FastAPI; backend điều phối product service trong SQLite và RAG service dựa trên Chroma cùng model provider bên ngoài.</desc>
