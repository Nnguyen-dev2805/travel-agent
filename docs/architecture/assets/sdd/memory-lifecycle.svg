<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="sdd-memory-title sdd-memory-desc">
      <title id="sdd-memory-title">Vòng đời Memory và answer path của Travel Agent</title>
      <desc id="sdd-memory-desc">User message được persist vào conversation, extract thành candidate, promotion theo policy thành record theo scope, được select ở chat turn sau và compose với travel RAG context để model generation.</desc>
      <defs><style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="sdd-memory-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
        <marker id="sdd-memory-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
      </defs>
      <rect width="1280" height="720" fill="#f5f5f5"/>
      <path d="M200 352 H240" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sdd-memory-arrow)"/>
      <path d="M400 352 H440" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sdd-memory-arrow)"/>
      <path d="M600 352 H640" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#sdd-memory-accent)"/>
      <path d="M800 352 H840" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#sdd-memory-accent)"/>
      <path d="M1000 344 H1016 Q1024 344 1024 336 V232 Q1024 224 1032 224 H1060" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sdd-memory-arrow)"/>
      <path d="M1140 288 V416" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#sdd-memory-accent)"/>
      <path d="M1000 360 H1008 Q1016 360 1016 368 V472 Q1016 480 1024 480 H1060" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sdd-memory-arrow)"/>
      <g><rect x="40" y="304" width="160" height="96" rx="6" fill="rgba(79,93,117,.1)" stroke="#7a8399"/><text x="56" y="328" fill="#7a8399" font-family="'Geist Mono',monospace" font-size="8" letter-spacing="1">ĐẦU VÀO</text><text x="120" y="356" text-anchor="middle" fill="#2d3142" font-family="Geist,Arial,sans-serif" font-size="16" font-weight="600">Tin nhắn user</text><text x="120" y="380" text-anchor="middle" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="12">nội dung untrusted</text></g>
      <g><rect x="240" y="304" width="160" height="96" rx="6" fill="#fff" stroke="#2d3142"/><text x="256" y="328" fill="#7a8399" font-family="'Geist Mono',monospace" font-size="8" letter-spacing="1">PERSIST</text><text x="320" y="356" text-anchor="middle" fill="#2d3142" font-family="Geist,Arial,sans-serif" font-size="16" font-weight="600">Hội thoại</text><text x="320" y="380" text-anchor="middle" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="12">message + provenance</text></g>
      <g><rect x="440" y="304" width="160" height="96" rx="6" fill="#fff" stroke="#2d3142"/><text x="456" y="328" fill="#7a8399" font-family="'Geist Mono',monospace" font-size="8" letter-spacing="1">TRÍCH XUẤT</text><text x="520" y="356" text-anchor="middle" fill="#2d3142" font-family="Geist,Arial,sans-serif" font-size="16" font-weight="600">Rule + Policy</text><text x="520" y="380" text-anchor="middle" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="12">signal + safety filter</text></g>
      <g><rect x="640" y="304" width="160" height="96" rx="6" fill="rgba(45,49,66,.05)" stroke="#4f5d75"/><text x="656" y="328" fill="#7a8399" font-family="'Geist Mono',monospace" font-size="8" letter-spacing="1">SHADOW</text><text x="720" y="356" text-anchor="middle" fill="#2d3142" font-family="Geist,Arial,sans-serif" font-size="16" font-weight="600">Candidate</text><text x="720" y="380" text-anchor="middle" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="12">chưa dùng cho answer</text></g>
      <g><rect x="840" y="304" width="160" height="96" rx="6" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/><text x="856" y="328" fill="#eb6c36" font-family="'Geist Mono',monospace" font-size="8" letter-spacing="1">QUẢN TRỊ</text><text x="920" y="356" text-anchor="middle" fill="#2d3142" font-family="Geist,Arial,sans-serif" font-size="16" font-weight="600">Promotion</text><text x="920" y="380" text-anchor="middle" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="12">confidence + scope</text></g>
      <g><rect x="1060" y="176" width="160" height="112" rx="6" fill="rgba(235,108,54,.08)" stroke="#eb6c36" stroke-width="1.2"/><text x="1076" y="200" fill="#eb6c36" font-family="'Geist Mono',monospace" font-size="8" letter-spacing="1">BỀN VỮNG</text><text x="1140" y="228" text-anchor="middle" fill="#2d3142" font-family="Geist,Arial,sans-serif" font-size="16" font-weight="600">Memory Record</text><text x="1140" y="252" text-anchor="middle" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="12">active + theo scope</text><text x="1140" y="272" text-anchor="middle" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="12">có thể supersede fact cũ</text></g>
      <g><rect x="1060" y="416" width="160" height="128" rx="6" fill="#fff" stroke="#2d3142"/><text x="1076" y="440" fill="#7a8399" font-family="'Geist Mono',monospace" font-size="8" letter-spacing="1">ANSWER TURN</text><text x="1140" y="468" text-anchor="middle" fill="#2d3142" font-family="Geist,Arial,sans-serif" font-size="16" font-weight="600">Selection + Prompt</text><text x="1140" y="492" text-anchor="middle" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="12">lexical match + scope</text><text x="1140" y="512" text-anchor="middle" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="12">Memory + travel RAG</text><text x="1140" y="532" text-anchor="middle" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="12">sau đó model generation</text></g>
      <text x="40" y="144" fill="#7a8399" font-family="'Geist Mono',monospace" font-size="12">WRITE PATH: extraction và promotion tách khỏi normal chat turn.</text>
      <text x="40" y="616" fill="#7a8399" font-family="'Geist Mono',monospace" font-size="12">READ PATH: chỉ active record đủ điều kiện vào bound chat có feature gate; selection trả trace metadata, không trả raw Memory text.</text>
      <line x1="40" y1="656" x2="1240" y2="656" stroke="rgba(45,49,66,.12)"/>
      <text x="40" y="688" fill="#4f5d75" font-family="'Geist Mono',monospace" font-size="12">XÁM: persisted state</text><text x="320" y="688" fill="#eb6c36" font-family="'Geist Mono',monospace" font-size="12">CAM: governed Memory transition</text>
    </svg>