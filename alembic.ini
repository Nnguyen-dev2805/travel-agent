# Alembic configuration for the Travel Agent PostgreSQL write path.
#
# The live DSN never lives here: `backend/storage/migrations/env.py` reads
# PG_DSN from the environment and overrides sqlalchemy.url. The placeholder
# below carries a host and database name only, no credentials.
[alembic]
script_location = backend/storage/migrations
sqlalchemy.url = postgresql+psycopg://localhost/travel_agent

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
