# Alembic configuration for the Travel Agent PostgreSQL write path.
#
# The live DSN never lives here: `backend/storage/migrations/env.py` resolves
# PG_DSN, then an explicitly configured sqlalchemy.url, then DATABASE_URL.
# The placeholder below is intentionally blank.
[alembic]
script_location = backend/storage/migrations
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
