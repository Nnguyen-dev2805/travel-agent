services:
  postgres_db:
    image: postgres:15-alpine
    container_name: travel_agent_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=travel_agent
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: travel_agent_backend
    ports:
      - "8080:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres_db:5432/travel_agent
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
      - ~/.cache/huggingface:/root/.cache/huggingface
    depends_on:
      - postgres_db
    command: >
      sh -c "alembic -c backend/alembic.ini upgrade head &&
             uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped

  outbox_worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: travel_agent_outbox_worker
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres_db:5432/travel_agent
    command: ["python", "-m", "backend.workers.outbox_worker"]
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
      - ~/.cache/huggingface:/root/.cache/huggingface
    depends_on:
      - backend
      - postgres_db
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: travel_agent_frontend
    ports:
      - "5180:5173"
    environment:
      - VITE_API_URL=http://localhost:8080
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped

volumes:
  postgres_data:
